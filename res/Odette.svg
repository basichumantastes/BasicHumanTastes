<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="91.44mm" height="128.5mm" viewBox="0 0 91.44 128.5">
  <!-- Odette, 18HP : ivoire (le cygne blanc), encre noire (le cygne noir), accents sarcelle (le lac) -->
  <rect x="0" y="0" width="91.44" height="128.5" fill="#f2efe8"/>
  <!-- Bandeau noir de l'afficheur -->
  <rect x="0" y="0" width="91.44" height="11" fill="#f2efe8"/>
  <rect x="6" y="12.5" width="79.44" height="14" rx="1.5" fill="#161618"/>
  <!-- Filets sarcelle entre les sections -->
  <line x1="4" y1="50" x2="87.44" y2="50" stroke="#2a7f7a" stroke-width="0.3"/>
  <line x1="4" y1="69.5" x2="87.44" y2="69.5" stroke="#2a7f7a" stroke-width="0.3"/>
  <line x1="4" y1="86" x2="87.44" y2="86" stroke="#2a7f7a" stroke-width="0.3" opacity="0.5"/>
  <!-- Deux ailes stylisées sous le titre -->
  <path d="M33,11.4 Q39.5,10 45.72,11.1 Q51.9,10 58.4,11.4" fill="none" stroke="#2a7f7a" stroke-width="0.35"/>
  <!-- Plaques noires des sorties -->
  <rect x="76.94" y="71.3" width="11" height="13.4" rx="1.5" fill="#161618"/>
  <rect x="64.7" y="102.8" width="23.24" height="18.6" rx="1.5" fill="#161618"/>
</svg>
