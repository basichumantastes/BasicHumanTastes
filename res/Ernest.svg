<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60.96mm" height="128.5mm" viewBox="0 0 60.96 128.5">
  <!-- Façade ocre moutarde, bandeaux anthracite, écran vert d'eau façon tube fluorescent -->
  <rect x="0" y="0" width="60.96" height="128.5" fill="#e0a930"/>
  <!-- Bandeau anthracite avec l'écran, souligné d'un filet ocre foncé -->
  <rect x="0" y="0" width="60.96" height="27" fill="#26231f"/>
  <rect x="0" y="27" width="60.96" height="0.8" fill="#b8861c"/>
  <rect x="6" y="14" width="48.96" height="10" rx="0.8" fill="#0e1513" stroke="#2f4a44" stroke-width="0.3"/>
  <!-- Filets anthracite entre les sections -->
  <line x1="4" y1="48.5" x2="56.96" y2="48.5" stroke="#26231f" stroke-width="0.25"/>
  <line x1="4" y1="69.4" x2="56.96" y2="69.4" stroke="#26231f" stroke-width="0.25"/>
  <line x1="4" y1="87.5" x2="56.96" y2="87.5" stroke="#26231f" stroke-width="0.25"/>
  <!-- Icônes des formes de modulation autour du bouton (générées pour les angles du RoundBlackKnob) -->
  <g fill="none" stroke="#26231f" stroke-width="0.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Saw Down -->
    <path transform="translate(6.379,65.800)" d="M0,0 L1.6,2 L1.6,0 L3.2,2"/>
    <circle cx="9.149" cy="64.820" r="0.25" fill="#26231f" stroke="none"/>
    <!-- Square -->
    <path transform="translate(2.500,58.950)" d="M0,2 L0,0 L1.6,0 L1.6,2 L3.2,2 L3.2,0"/>
    <circle cx="6.400" cy="59.965" r="0.25" fill="#26231f" stroke="none"/>
    <!-- Triangle -->
    <path transform="translate(6.464,52.150)" d="M0,2 L0.8,0 L1.6,2 L2.4,0 L3.2,2"/>
    <circle cx="9.210" cy="55.144" r="0.25" fill="#26231f" stroke="none"/>
    <!-- Sample & Hold -->
    <path transform="translate(14.336,52.150)" d="M0,1.2 L0.8,1.2 L0.8,0 L1.6,0 L1.6,2 L2.4,2 L2.4,0.7 L3.2,0.7"/>
    <circle cx="14.790" cy="55.144" r="0.25" fill="#26231f" stroke="none"/>
    <!-- Noise -->
    <path transform="translate(18.300,58.950)" d="M0,1 L0.3,0.2 L0.6,1.8 L0.9,0.6 L1.2,1.5 L1.5,0 L1.8,2 L2.1,0.8 L2.4,1.6 L2.7,0.3 L3,1.4 L3.2,1"/>
    <circle cx="17.600" cy="59.965" r="0.25" fill="#26231f" stroke="none"/>
    <!-- Envelope -->
    <path transform="translate(14.421,65.800)" d="M0,2 L0,0 C0.5,1.3 1.3,1.9 3.2,2"/>
    <circle cx="14.851" cy="64.820" r="0.25" fill="#26231f" stroke="none"/>
  </g>
  <!-- Plaque anthracite des sorties -->
  <rect x="31" y="103" width="27.5" height="17.5" rx="1.5" fill="#26231f"/>
  <!-- Bandeau du bas anthracite -->
  <rect x="0" y="122" width="60.96" height="6.5" fill="#26231f"/>
</svg>
